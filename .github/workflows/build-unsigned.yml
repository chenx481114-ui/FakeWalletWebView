name: Build unsigned iOS IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build unsigned app
        run: |
          xcodebuild \
            -project FakeWalletWebView.xcodeproj \
            -target FakeWalletWebView \
            -sdk iphoneos \
            -configuration Release \
            CONFIGURATION_BUILD_DIR="$PWD/build" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=NO

      - name: Package IPA
        run: |
          test -d build/FakeWalletWebView.app
          mkdir -p Payload
          cp -R build/FakeWalletWebView.app Payload/FakeWalletWebView.app
          zip -r FakeWalletWebView-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: FakeWalletWebView-unsigned
          path: FakeWalletWebView-unsigned.ipa
